<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Store</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f1f3f6;
}

header{
background:#2874f0;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav button{
margin-left:5px;
padding:8px 12px;
border:none;
background:white;
color:#2874f0;
cursor:pointer;
}

.banner{
height:180px;
background:url("https://images.unsplash.com/photo-1607083206968-13611e3d76db") center/cover;
}

.categories{
display:flex;
gap:10px;
justify-content:center;
padding:10px;
background:white;
}

.categories button{
padding:10px;
border:none;
background:#eee;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:8px;
padding:10px;
text-align:center;
box-shadow:0 1px 5px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.btn{
background:#fb641b;
color:white;
border:none;
padding:8px;
cursor:pointer;
margin-top:5px;
}

.cart-item{
background:white;
margin:10px;
padding:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.admin{
max-width:400px;
margin:auto;
background:white;
padding:20px;
}

input{
padding:8px;
margin:5px;
width:90%;
}

</style>

</head>

<body>

<header>

<h2>My Store</h2>

<nav>
<button onclick="home()">Home</button>
<button onclick="cartPage()">Cart</button>
<button onclick="loginPage()">Login</button>
<button onclick="adminLogin()">Admin</button>
</nav>

</header>

<div class="banner"></div>

<div class="categories">
<button onclick="filter('All')">All</button>
<button onclick="filter('Clothes')">Clothes</button>
<button onclick="filter('Shoes')">Shoes</button>
<button onclick="filter('Electronics')">Electronics</button>
</div>

<div id="app"></div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [

{id:1,name:"T Shirt",price:499,category:"Clothes",image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"},
{id:2,name:"Running Shoes",price:999,category:"Shoes",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{id:3,name:"Smart Watch",price:1999,category:"Electronics",image:"https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b"}

]

let cart = JSON.parse(localStorage.getItem("cart")) || []

function save(){
localStorage.setItem("cart",JSON.stringify(cart))
localStorage.setItem("products",JSON.stringify(products))
}

function home(){
showProducts(products)
}

function showProducts(list){

let html="<div class='grid'>"

list.forEach(p=>{

html+=`

<div class="card">

<img src="${p.image}">

<h3>${p.name}</h3>

<p>₹${p.price}</p>

<button class="btn" onclick="addCart(${p.id})">Add to Cart</button>

</div>

`

})

html+="</div>"

document.getElementById("app").innerHTML=html
}

function filter(cat){

if(cat==="All"){
showProducts(products)
}else{
showProducts(products.filter(p=>p.category===cat))
}

}

function addCart(id){

let item = cart.find(i=>i.id===id)

if(item){
item.qty++
}else{
cart.push({id:id,qty:1})
}

save()
alert("Added to cart")

}

function cartPage(){

let html="<h2 style='padding:10px'>Cart</h2>"

let total=0

cart.forEach(item=>{

let p=products.find(x=>x.id===item.id)

total+=p.price*item.qty

html+=`

<div class="cart-item">

<div>

${p.name}<br>

₹${p.price} x ${item.qty}

</div>

<div>

<button onclick="changeQty(${item.id},1)">+</button>

<button onclick="changeQty(${item.id},-1)">-</button>

<button onclick="removeItem(${item.id})">Remove</button>

</div>

</div>

`

})

html+=`<h3 style='padding:10px'>Total ₹${total}</h3>`

html+=`<button class="btn" onclick="addressPage()">Checkout COD</button>`

document.getElementById("app").innerHTML=html

}

function changeQty(id,delta){

let item=cart.find(i=>i.id===id)

item.qty+=delta

if(item.qty<=0){
cart=cart.filter(i=>i.id!==id)
}

save()
cartPage()

}

function removeItem(id){

cart=cart.filter(i=>i.id!==id)

save()
cartPage()

}

function addressPage(){

document.getElementById("app").innerHTML=`

<h2>Delivery Address</h2>

<input id="name" placeholder="Full Name">

<input id="address" placeholder="Address">

<input id="phone" placeholder="Phone">

<button class="btn" onclick="placeOrder()">Place Order COD</button>

`

}

function placeOrder(){

let orders = JSON.parse(localStorage.getItem("orders")) || []

let name=document.getElementById("name").value
let address=document.getElementById("address").value
let phone=document.getElementById("phone").value

orders.push({

items:cart,
name:name,
address:address,
phone:phone,
date:new Date().toLocaleString()

})

localStorage.setItem("orders",JSON.stringify(orders))

cart=[]
save()

document.getElementById("app").innerHTML="<h2>Order placed successfully (COD)</h2>"

}

function loginPage(){

document.getElementById("app").innerHTML=`

<h2>Customer Login</h2>

<input id="email" placeholder="Email">

<input id="pass" placeholder="Password">

<button onclick="login()">Login</button>

`

}

function login(){
alert("Login feature demo")
}

function adminLogin(){

let pass=prompt("Admin password")

if(pass!=="11111111"){
alert("Wrong password")
return
}

adminPanel()

}

function adminPanel(){

let html=`

<div class="admin">

<h2>Admin Panel</h2>

<input id="pname" placeholder="Product name">

<input id="pprice" placeholder="Price">

<input id="pcat" placeholder="Category">

<input id="pimg" placeholder="Image URL">

<button onclick="addProduct()">Add Product</button>

<button onclick="viewOrders()">View Orders</button>

<h3>Products</h3>

`

products.forEach(p=>{

html+=`

<div>

${p.name} ₹${p.price}

<button onclick="deleteProduct(${p.id})">Delete</button>

</div>

`

})

html+="</div>"

document.getElementById("app").innerHTML=html

}

function addProduct(){

let name=document.getElementById("pname").value
let price=document.getElementById("pprice").value
let cat=document.getElementById("pcat").value
let img=document.getElementById("pimg").value

products.push({

id:Date.now(),
name:name,
price:price,
category:cat,
image:img

})

save()

adminPanel()

}

function deleteProduct(id){

products=products.filter(p=>p.id!==id)

save()

adminPanel()

}

function viewOrders(){

let orders = JSON.parse(localStorage.getItem("orders")) || []

let html="<h2>Orders</h2>"

orders.forEach((o,i)=>{

html+=`<h3>Order ${i+1}</h3>`

html+=`Name: ${o.name}<br>Address: ${o.address}<br>Phone: ${o.phone}<br>Date: ${o.date}<br>`

o.items.forEach(it=>{

let p=products.find(x=>x.id===it.id)

if(p){
html+=`${p.name} x ${it.qty}<br>`
}

})

html+="<hr>"

})

document.getElementById("app").innerHTML=html

}

home()

</script>

</body>
</html>
